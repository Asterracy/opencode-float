<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="topbar" class="drag">
      <span class="grip">⠿</span>
      <select id="modelSelect" class="nodrag" title="选择模型" disabled></select>
      <span class="spacer"></span>
      <button id="newChatBtn" class="icon nodrag" title="新会话（服务重启/工具异常时重开）">🔄</button>
      <button id="pinBtn" class="icon nodrag" title="始终置顶">📌</button>
      <button id="settingsBtn" class="icon nodrag" title="服务设置">⚙</button>
      <button id="collapseBtn" class="icon nodrag" title="折叠 / 展开">—</button>
      <button id="closeBtn" class="icon nodrag" title="退出">✕</button>
    </div>

    <div id="settings" hidden>
      <div class="set-row"><label>服务地址</label><input id="setUrl" placeholder="http://127.0.0.1:4096/api" spellcheck="false"></div>
      <div class="set-row"><label>用户名</label><input id="setUser" placeholder="opencode（默认）" spellcheck="false"></div>
      <div class="set-row"><label>密码</label><input id="setPass" type="password" placeholder="留空则读本机 service.json"></div>
      <div id="setMsg"></div>
      <div class="set-actions">
        <button id="setRescan" class="mini">重新探测</button>
        <button id="setCancel" class="mini">取消</button>
        <button id="setSave" class="mini primary">检测并保存</button>
      </div>
    </div>

    <div id="replyArea" hidden>
      <div id="errorBar" hidden>
        <span id="errorText"></span>
        <span class="spacer"></span>
        <button id="switchModelBtn" class="mini" hidden>切换模型</button>
        <button id="retryBtn" class="mini" hidden>重试</button>
      </div>
      <div id="thinking" hidden>
        <span id="thinkingLabel">思考中</span>
        <span class="dots"><i class="d1">·</i><i class="d2">·</i><i class="d3">·</i></span>
      </div>
      <div id="replyBox"><div id="replyText"></div></div>
    </div>

    <div id="thumbs" hidden></div>

    <div id="inputRow">
      <button id="attachBtn" title="添加图片">📎</button>
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送"></textarea>
      <button id="sendBtn" title="发送">↗</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
